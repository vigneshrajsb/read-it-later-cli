name: Publish & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          CURRENT_TAG="${GITHUB_REF_NAME}"

          if [ -z "$PREV_TAG" ]; then
            RANGE="$CURRENT_TAG"
          else
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          fi

          {
            echo 'NOTES<<EOF'

            FEATS=$(git log "$RANGE" --pretty=format:"%s" | grep -i "^feat" | sed 's/^feat[:(]//' | sed 's/^[^)]*) //' | sed 's/^: //' || true)
            if [ -n "$FEATS" ]; then
              echo "### Features"
              echo "$FEATS" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi

            FIXES=$(git log "$RANGE" --pretty=format:"%s" | grep -i "^fix" | sed 's/^[^:]*: //' || true)
            if [ -n "$FIXES" ]; then
              echo "### Fixes"
              echo "$FIXES" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi

            OTHER=$(git log "$RANGE" --pretty=format:"%s" | grep -iv "^feat\|^fix\|^Release\|^Merge" || true)
            if [ -n "$OTHER" ]; then
              echo "### Other"
              echo "$OTHER" | while IFS= read -r line; do echo "- $line"; done
              echo ""
            fi

            echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG:-$(git rev-list --max-parents=0 HEAD)}...${CURRENT_TAG}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.notes.outputs.NOTES }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "$NOTES"
