name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint & format
        run: bun run lint

      - name: Type check
        run: bun run tsc --noEmit

      - name: Run tests
        run: bun test
        env:
          RIL_TEST: "1"
